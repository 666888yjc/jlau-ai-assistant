<svg viewBox="0 0 375 812" width="375" height="812" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <!-- ============ STATUS BAR ============ -->
  <rect x="0" y="0" width="375" height="88" fill="#FFFFFF"/>
  <text x="24" y="28" font-size="14" font-weight="600" fill="#1A1A1A">9:41</text>
  <!-- signal + battery -->
  <g stroke="#1A1A1A" stroke-width="1.5" fill="none" stroke-linecap="round">
    <rect x="344" y="18" width="22" height="11" rx="3"/>
    <rect x="347" y="21" width="13" height="5" rx="1.5" fill="#1A1A1A" stroke="none"/>
    <rect x="368" y="21" width="1.6" height="5" rx="0.8" fill="#1A1A1A" stroke="none"/>
  </g>

  <!-- ============ NAV BAR ============ -->
  <line x1="0" y1="88" x2="375" y2="88" stroke="#E6E8EB" stroke-width="1"/>
  <!-- back chevron (Lucide ChevronLeft) -->
  <path d="M22 72 L14 64 M22 72 L14 80" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="187.5" y="73" text-anchor="middle" font-size="17" font-weight="600" fill="#1A1A1A">吉农 AI 助手</text>
  <!-- more-horizontal (Lucide MoreHorizontal) -->
  <circle cx="346" cy="64" r="1.6" fill="#1A1A1A"/>
  <circle cx="352" cy="64" r="1.6" fill="#1A1A1A"/>
  <circle cx="358" cy="64" r="1.6" fill="#1A1A1A"/>

  <!-- page background below nav -->
  <rect x="0" y="88" width="375" height="724" fill="#F5F6F7"/>

  <!-- ============ AI WELCOME BUBBLE ============ -->
  <!-- avatar ring (accent2) -->
  <circle cx="26" cy="126" r="18" fill="#E9F8F3" stroke="#14BF96" stroke-width="2"/>
  <text x="26" y="131" text-anchor="middle" font-size="14" font-weight="600" fill="#14BF96">吉</text>
  <!-- name chip (accent3 bg, white text) -->
  <rect x="50" y="100" width="60" height="20" rx="10" fill="#1A6B3C"/>
  <text x="80" y="114" text-anchor="middle" font-size="12" font-weight="500" fill="#FFFFFF">吉小农</text>
  <!-- bubble (bubbleAi mint tint) -->
  <rect x="50" y="124" width="289" height="64" rx="12" fill="#E9F8F3"/>
  <text x="66" y="150" font-size="14" fill="#0F3D2A">同学你好，我是吉小农，吉林农业大学</text>
  <text x="66" y="172" font-size="14" fill="#0F3D2A">的一站式校园 AI 助手，随时问我～</text>

  <!-- ============ USER BUBBLE ============ -->
  <rect x="95" y="208" width="264" height="40" rx="12" fill="#ECEEF1"/>
  <text x="343" y="233" text-anchor="end" font-size="14" fill="#1A1A1A">报到要带哪些材料？</text>
  <circle cx="347" cy="228" r="18" fill="#ECEEF1" stroke="#B4B9C0" stroke-width="1.5"/>
  <text x="347" y="233" text-anchor="middle" font-size="13" fill="#8A9099">我</text>

  <!-- ============ AI ANSWER BUBBLE ============ -->
  <circle cx="26" cy="322" r="18" fill="#E9F8F3" stroke="#14BF96" stroke-width="2"/>
  <text x="26" y="327" text-anchor="middle" font-size="14" font-weight="600" fill="#14BF96">吉</text>
  <rect x="50" y="282" width="289" height="156" rx="12" fill="#E9F8F3"/>
  <text x="66" y="308" font-size="14" font-weight="500" fill="#0F3D2A">新生报到需携带以下材料：</text>
  <text x="66" y="332" font-size="14" fill="#0F3D2A">· 录取通知书、身份证原件</text>
  <text x="66" y="356" font-size="14" fill="#0F3D2A">· 档案、户口迁移证（如需迁移）</text>
  <text x="66" y="380" font-size="14" fill="#0F3D2A">· 小 2 寸证件照 10 张</text>
  <text x="66" y="404" font-size="14" fill="#0F3D2A">· 缴费单据 / 助学贷款材料</text>
  <!-- source chip (white bg, accent3 stroke) -->
  <rect x="66" y="416" width="172" height="22" rx="11" fill="#FFFFFF" stroke="#1A6B3C" stroke-width="1"/>
  <text x="78" y="431" font-size="11" fill="#1A6B3C">来源：2026 新生入学须知</text>

  <!-- feedback text buttons (Lucide ThumbUp / Flag, text-primary) -->
  <g>
    <!-- ThumbUp icon 16 -->
    <g transform="translate(50,452)" stroke="#4A4F57" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 7 V14 H11"/>
      <path d="M11 14 C11 11 14 9 16 9 V7 H11 L9 2 C8 1 7 1 6 2 L2 7 Z" transform="translate(-2,0)"/>
    </g>
    <text x="72" y="464" font-size="13" fill="#4A4F57">有帮助</text>
    <!-- Flag icon 16 -->
    <g transform="translate(130,452)" stroke="#4A4F57" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 2 V14"/>
      <path d="M3 2 H13 L11 5 L13 8 H3"/>
    </g>
    <text x="150" y="464" font-size="13" fill="#4A4F57">报错</text>
  </g>

  <!-- ============ 猜你想问 ============ -->
  <text x="16" y="512" font-size="15" font-weight="600" fill="#1A1A1A">猜你想问</text>
  <!-- card 1 -->
  <rect x="16" y="524" width="168" height="48" rx="12" fill="#F2F4F3"/>
  <circle cx="38" cy="548" r="11" fill="#14BF96"/>
  <text x="38" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">图</text>
  <text x="58" y="553" font-size="13" fill="#4A4F57">图书馆开放时间</text>
  <!-- card 2 -->
  <rect x="191" y="524" width="168" height="48" rx="12" fill="#F2F4F3"/>
  <circle cx="213" cy="548" r="11" fill="#14BF96"/>
  <text x="213" y="553" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">报</text>
  <text x="233" y="553" font-size="13" fill="#4A4F57">新生报到流程</text>
  <!-- card 3 -->
  <rect x="16" y="580" width="168" height="48" rx="12" fill="#F2F4F3"/>
  <circle cx="38" cy="604" r="11" fill="#14BF96"/>
  <text x="38" y="609" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">历</text>
  <text x="58" y="609" font-size="13" fill="#4A4F57">本学期校历</text>
  <!-- card 4 -->
  <rect x="191" y="580" width="168" height="48" rx="12" fill="#F2F4F3"/>
  <circle cx="213" cy="604" r="11" fill="#14BF96"/>
  <text x="213" y="609" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">图</text>
  <text x="233" y="609" font-size="13" fill="#4A4F57">校园地图导航</text>

  <!-- ============ INPUT BAR ============ -->
  <rect x="0" y="748" width="375" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="748" x2="375" y2="748" stroke="#E6E8EB" stroke-width="1"/>
  <rect x="16" y="762" width="268" height="40" rx="20" fill="#F2F4F3"/>
  <text x="32" y="787" font-size="14" fill="#B4B9C0">问问吉小农：图书馆几点关门？</text>
  <!-- Mic icon 20 (Lucide Mic) -->
  <g transform="translate(294,772)" stroke="#8A9099" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-5" y="-9" width="10" height="14" rx="5"/>
    <path d="M-7 5 Q0 11 7 5"/>
    <path d="M0 11 V14"/>
    <circle cx="0" cy="16" r="1"/>
  </g>
  <!-- Send button (accent circle, Lucide Send) -->
  <circle cx="344" cy="782" r="18" fill="#07C160"/>
  <g transform="translate(344,782)" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-7 -1 L5 -6 M-7 -1 L5 4 M-7 -1 L8 -1"/>
    <path d="M-7 4 L-7 -6"/>
  </g>
</svg>
