<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- 主色已由微信绿 #07C160 改为农大绿 #3D6B51（与 design-tokens.json color.accent 保持一致） -->
    <meta name="theme-color" content="#3D6B51" />
    <!-- SEC-4 子集：Referrer-Policy 用 meta 零风险落地（HSTS/CSP/X-Frame 等需托管控制台配置响应头） -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- PWA：图标 + manifest，让手机能"添加到主屏幕"像原生 App 一样打开（竞品灵感） -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>吉农 AI 助手 · 吉小农</title>
    <!-- 微信/QQ 分享卡片：内置浏览器分享链接时显示标题/简介/缩略图，否则分享出去是光秃秃的链接。 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="吉小农 · 吉林农业大学新生报到 AI 助手" />
    <meta property="og:description" content="材料、流程、交通、住宿、美食，一站说清。专为吉小农量身打造的迎新答疑助手。" />
    <meta property="og:image" content="https://yjc-d0gvjkk8tae8bf1ad-1411562898.tcloudbaseapp.com/share-card.png" />
    <meta property="og:url" content="https://yjc-d0gvjkk8tae8bf1ad-1411562898.tcloudbaseapp.com/" />
    <meta name="description" content="吉林农业大学新生报到 AI 助手：材料、流程、交通、住宿、美食，一站说清。" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://yjc-d0gvjkk8tae8bf1ad-1411562898.tcloudbaseapp.com/share-card.png" />
    <!-- LOAD-6：入口与关键 chunk 的 modulepreload 由 Vite 构建自动注入（带哈希），
         这里不手写 —— 手写 /src/ 引用会被 Vite 内联成 base64 data URI，反而膨胀 HTML。 -->
    <style>
      /* 防白闪：token 注入前先给出纸底/墨色，深色系统偏好下同步（MOB-5 保护项 9，勿删） */
      html {
        background: #faf9f5;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #131512;
        }
      }
      /* LOAD-5 首帧骨架：JS 未就绪前给一个「有结构」的等待画面，弱网 1s 内可见。
         这里用硬编码 token 值（此时 JS 尚未注入 CSS 变量），与 global.css §15 的
         .page-skeleton 视觉一致。Suspense fallback 复用后者，两处观感统一。 */
      .sk-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 480px;
        margin: 0 auto;
        background: #faf9f5;
      }
      .sk-header {
        height: 48px;
        background: #ffffff;
        border-bottom: 1px solid #e4e2d9;
      }
      .sk-body {
        flex: 1;
        padding: 24px 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .sk-line {
        display: block;
        height: 14px;
        border-radius: 9999px;
        background: #f2f1eb;
        animation: sk-pulse 1.4s ease-in-out infinite;
      }
      .sk-line.mid {
        width: 72%;
      }
      .sk-line.short {
        width: 44%;
      }
      @keyframes sk-pulse {
        0%,
        100% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-color-scheme: dark) {
        .sk-shell {
          background: #131512;
        }
        .sk-header {
          background: #1b1e19;
          border-bottom-color: #2c302a;
        }
        .sk-line {
          background: #232720;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk-line {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 首帧静态骨架：React 挂载后会被整体替换，不存在残留 -->
      <div class="sk-shell" aria-hidden="true">
        <div class="sk-header"></div>
        <div class="sk-body">
          <span class="sk-line"></span>
          <span class="sk-line mid"></span>
          <span class="sk-line"></span>
          <span class="sk-line short"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
